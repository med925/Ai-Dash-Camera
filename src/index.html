  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="description" content="Accent France - AI dash camera and fleet monitoring solution.">
  <meta name="keywords" content="Accent France, ACCENT-FR, caméra embarquée IA, dashcam IA, dashcam flotte, sécurité routière, gestion de flotte, caméra intelligente conducteur, DMS ADAS, AI dash camera, fleet safety, fleet monitoring, transport de marchandises, taxis VTC, bus scolaires, transport public, car rental telematics">
  <link rel="canonical" href="https://accentfrance.com/">
  <script>
    (function() {
      var theme = localStorage.getItem('accent-theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } else {
        // Detect system/browser preference
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', prefersDark);
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/logo_accent.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
